# The hand-curated half of the orchestrator's roster (the generated half comes from your agent registry:
# a team-roster.md table, each agent's dept.yaml, a rooms.yaml of business units, the HUD's vocal recipients).
# `python -m oi.orchestrator.gen_roster` merges both into roster.yaml. EXAMPLE values: replace them with yours.
# Per agent slug (= the oi.vocal recipient slug):
#   ask_for  what the user asks this agent for (one line, shown to the model)
#   topics   FR/EN keywords the local topic router matches in a wish ("ask someone for the budget" -> orion)
#   bu       business units when the rooms file does not list the agent
# Never a secret, a token, a path to a credential or a client's private detail here.
agents:
  atlas:
    ask_for: tools and automations — a bug, a script, a scheduled job, a pull request, the HUD
    topics: [bug, outil, tool, hud, automatisation, automation, script, code, github, pr]
  nova:
    ask_for: planning — priorities, decisions, meetings, who does what
    topics: [priorité, priority, planning, décision, decision, réunion, meeting, roadmap]
  orion:
    ask_for: finance — budgets, invoices, reports and metrics
    topics: [finance, budget, facture, invoice, rapport, report, kpi, metrics]
