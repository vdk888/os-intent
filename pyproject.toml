[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "oi"
license = {text = "MIT"}
version = "0.2.0"
description = "OS-intent: learns what you do next on your Mac and puts it one key away"
requires-python = ">=3.12"
dependencies = ["pyyaml>=6"]  # W3: forms are YAML

[project.optional-dependencies]
dev = ["pytest>=8"]
# W3: Laya's own tokenizer (ModernBERT tokenizer.json from the HF cache) for exact token counts.
laya = ["tokenizers>=0.20"]

[project.scripts]
oi = "oi.cli:main"
oi-markov = "oi.cli_markov:main"

[tool.setuptools]
packages = ["oi", "oi.forms", "oi.orchestrator", "oi.onboard_agent", "oi.proactive"]

[tool.setuptools.package-data]
"oi.forms" = ["*.yaml"]
"oi" = ["prompts/*.md"]
"oi.orchestrator" = ["*.md", "*.yaml", "skills/*.md"]   # W25
"oi.onboard_agent" = ["prompts/*.md"]   # W22b

[tool.pytest.ini_options]
testpaths = ["tests"]
